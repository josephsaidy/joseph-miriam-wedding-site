name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build wedding site
        working-directory: artifacts/wedding
        run: pnpm run build
        env:
          PORT: 4173
          BASE_PATH: /joseph-miriam-wedding-site/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}

      - name: Find and prepare Pages output
        run: |
          echo "Searching for built index.html..."
          find artifacts/wedding -type f -name index.html -not -path "*/node_modules/*" -print

          BUILD_INDEX=$(find artifacts/wedding -type f -name index.html -not -path "*/node_modules/*" -not -path "*/src/*" | grep -E "/(dist|build|out|public)/" | head -n 1)

          if [ -z "$BUILD_INDEX" ]; then
            echo "No built index.html found in dist/build/out/public."
            echo "Directory tree:"
            find artifacts/wedding -maxdepth 4 -type d -print
            exit 1
          fi

          BUILD_DIR=$(dirname "$BUILD_INDEX")
          echo "Using build directory: $BUILD_DIR"

          rm -rf pages-dist
          mkdir -p pages-dist
          cp -a "$BUILD_DIR"/. pages-dist/

          cp pages-dist/index.html pages-dist/404.html

          echo "Final Pages files:"
          ls -la pages-dist
          test -f pages-dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
